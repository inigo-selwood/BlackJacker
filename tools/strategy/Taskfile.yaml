version: '3'

vars:
  PYTHON: tools/strategy/.venv/bin/python
  SOURCE_DIR: tools/strategy/source
  TEST_DIR: tools/strategy/test/unit

tasks:
  format:
    desc: Format strategy Python source
    dir: ../..
    cmds:
      - >-
        {{.PYTHON}}
        -m black
        --config tools/strategy/pyproject.toml
        {{.SOURCE_DIR}}
        tools/strategy/test

  run:
    desc: Run the strategy generator
    dir: ../..
    cmds:
      - >-
        PYTHONPATH={{.SOURCE_DIR}}
        {{.PYTHON}}
        {{.SOURCE_DIR}}/main.py
        {{.CLI_ARGS}}

  test:
    desc: Run strategy checks
    dir: ../..
    cmds:
      - >-
        PYTHONPATH={{.SOURCE_DIR}}
        {{.PYTHON}}
        -m compileall
        -q
        {{.SOURCE_DIR}}
        {{.TEST_DIR}}
      - >-
        PYTHONPATH={{.SOURCE_DIR}}
        {{.PYTHON}}
        -m pytest
        {{.TEST_DIR}}
